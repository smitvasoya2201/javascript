<!DOCTYPE html>
<html>
<head>
    <title>Form Validation Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-box">

        <h2>Registration Form</h2>

        <form id="myForm">
            <p class="vali">enter your name</p>
            <label>Name</label>
            <input type="text" id="name">

            <p class="vali">enter your age</p>
            <label>Age</label>
            <input type="text" id="age">

             <p class="vali">enter your email @gmail.com</p>
            <label>Email</label>
            <input type="email" id="email">

             <p class="vali">enter your password</p>
            <label>Password</label>
            <input type="password" id="password">

             <p class="vali">enter your password again</p>
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword">

             <p class="vali">enter your submit</p>

            <button type="submit" id="submitBtn">Submit</button>

            <p id="success"></p>

        </form>

    </div>

    <script src="task.js"></script>

</body>
</html>
